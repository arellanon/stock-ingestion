[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "stock-predictor-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "pandas>=2.2,<3", "pyarrow>=18", "exchange-calendars>=4.6,<5", "typer>=0.15,<1"]
[project.optional-dependencies]
yahoo = ["yfinance>=0.2.54,<2"]
alpaca = ["alpaca-py>=0.40,<1"]
ibkr = ["ibapi>=9.81,<10"]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools]
py-modules = ["migrations_snapshot"]
package-dir = {"" = "src"}
